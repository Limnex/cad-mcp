name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv
      - name: Sync dependencies
        run: uv sync --locked --dev
      - name: Run tests
        run: uv run pytest -m "not acad"
      - name: Build Python package
        run: uv build --wheel
